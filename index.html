<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale or user-scalable=no: blocking pinch-zoom of the interface
         fails WCAG 1.4.4. Double-tap zoom is suppressed on the reading stage alone,
         via touch-action, so it cannot fight the tap-to-turn gesture. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1a22" />
    <meta name="description" content="A fixed-layout-first ebook reader for children's picture books." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Story Tale Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
